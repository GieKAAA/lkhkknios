# Build iOS IPA tanpa Mac lokal.
#
# Jalankan manual dari tab Actions ("Build iOS IPA" -> Run workflow), lalu
# unduh artifact di halaman run. Namanya memuat versi dan nomor build,
# misalnya "lkh-kkn-ios-v1.0.0-build7" - nomor build yang lebih besar selalu
# lebih baru.
#
# Catatan penting:
# - Hasilnya IPA *unsigned* (tanpa sertifikat Apple, karena signing butuh
#   Apple ID/certificate yang tidak bisa dibuat headless dengan akun gratis).
#   Pasang lewat re-sign tool seperti KSign/Sideloadly/AltStore dengan Apple
#   ID sendiri - sama seperti alur KSign yang sudah dipakai sebelumnya
#   (lihat PANDUAN-BUILD-IPA.md bagian 5B).
# - Runner macOS menghabiskan menit build 10x lipat di repo privat (paket
#   gratis GitHub = ~200 menit macOS/bulan, cukup untuk beberapa build).

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Image runner (WAJIB punya Xcode 26 / SDK iOS 26)"
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-latest
          - macos-15

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # react-native-vision-camera 5.x WAJIB dikompilasi dengan SDK iOS 26.
    # Sumbernya memakai simbol iOS 26 (.appleLog2, .proResRAW, .dogHead,
    # .catHead, isDeferredStartSupported, ...) di dalam blok
    # `if #available(iOS 26.0, *)`. `#available` itu cek RUNTIME - simbolnya
    # tetap harus ADA saat KOMPILASI, jadi SDK lama gagal dengan puluhan
    # "no member named". Runner macos-15 membawa Xcode 16.x (SDK iOS 18),
    # itulah sebab build sebelumnya gagal.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Gagal di sini dalam hitungan detik dengan pesan jelas jauh lebih baik
      # daripada gagal sepuluh menit kemudian terkubur ratusan error Swift.
      - name: Pilih Xcode terbaru dan pastikan SDK iOS 26 tersedia
        run: |
          echo "Xcode yang terpasang di runner ini:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (tidak ada)"
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            echo "Memakai: $NEWEST"
            sudo xcode-select -s "$NEWEST"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          SDK=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "SDK iOS tertinggi: ${SDK:-TIDAK TERBACA}"
          case "$SDK" in
            "") echo "::error::Tidak bisa membaca versi SDK iOS." ; exit 1 ;;
          esac
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::Runner ini hanya punya SDK iOS $SDK. react-native-vision-camera 5.x butuh SDK iOS 26 - jalankan ulang workflow dan pilih runner lain di input 'runner'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Tiap run mendapat nomor build sendiri supaya dua IPA tidak pernah
      # tampak identik. github.run_number naik terus dan tidak pernah
      # terulang, jadi IPA yang lebih besar nomornya SELALU yang lebih baru -
      # itulah gunanya CFBundleVersion di iOS.
      #
      # CATATAN: ini versi APLIKASI, bukan APP_VERSION di utils/deviceInfo.ts.
      # Yang di deviceInfo.ts dikirim ke server LKH sebagai `version=...` dan
      # sengaja meniru versi aplikasi Flutter resmi supaya tidak ditolak
      # gerbang versi di server - jangan pernah menaikkannya di sini.
      - name: Setel nomor build unik
        run: |
          node -e 'const fs=require("fs");
            const cfg=JSON.parse(fs.readFileSync("app.json","utf8"));
            cfg.expo.ios=cfg.expo.ios||{};
            cfg.expo.ios.buildNumber=process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync("app.json",JSON.stringify(cfg,null,2)+"\n");'
          VERSION=$(node -p 'require("./app.json").expo.version')
          echo "IPA_NAME=lkh-kkn-ios-v$VERSION-build$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Versi aplikasi $VERSION, nomor build $GITHUB_RUN_NUMBER"

      - name: Generate native iOS project (prebuild + pod install)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Archive (unsigned)
        run: |
          # BUGFIX: `-d` is load-bearing. An .xcworkspace is a DIRECTORY, and
          # `ls` on a directory lists its contents instead of printing the
          # path - so a bare `ls ios/*.xcworkspace` resolved to
          # "contents.xcworkspacedata" (the file inside it), and xcodebuild
          # died with "'contents.xcworkspacedata' does not exist" / exit 66.
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Tidak ada .xcworkspace di ios/ - prebuild gagal?" >&2
            ls -la ios 2>/dev/null >&2 || echo "folder ios/ tidak ada" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Tidak ada .app di dalam arsip - archive gagal?" >&2
            find build/App.xcarchive -maxdepth 3 >&2 2>/dev/null || true
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          STAGE="$RUNNER_TEMP/PayloadStage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/$IPA_NAME.ipa" Payload
          echo "IPA: $IPA_NAME.ipa"

      # Nama artifact ikut memuat versi + nomor build, jadi di halaman
      # Actions terlihat langsung mana yang terbaru tanpa harus membuka run.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa
          retention-days: 14
