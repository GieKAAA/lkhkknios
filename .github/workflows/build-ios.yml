# Build iOS IPA tanpa Mac lokal.
#
# Jalankan manual dari tab Actions ("Build iOS IPA" -> Run workflow), lalu
# unduh artifact "lkh-kkn-ios-ipa-unsigned" di halaman run.
#
# Catatan penting:
# - Hasilnya IPA *unsigned* (tanpa sertifikat Apple, karena signing butuh
#   Apple ID/certificate yang tidak bisa dibuat headless dengan akun gratis).
#   Pasang lewat re-sign tool seperti KSign/Sideloadly/AltStore dengan Apple
#   ID sendiri - sama seperti alur KSign yang sudah dipakai sebelumnya
#   (lihat PANDUAN-BUILD-IPA.md bagian 5B).
# - Runner macOS menghabiskan menit build 10x lipat di repo privat (paket
#   gratis GitHub = ~200 menit macOS/bulan, cukup untuk beberapa build).

name: Build iOS IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native iOS project (prebuild + pod install)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Archive (unsigned)
        run: |
          # BUGFIX: `-d` is load-bearing. An .xcworkspace is a DIRECTORY, and
          # `ls` on a directory lists its contents instead of printing the
          # path - so a bare `ls ios/*.xcworkspace` resolved to
          # "contents.xcworkspacedata" (the file inside it), and xcodebuild
          # died with "'contents.xcworkspacedata' does not exist" / exit 66.
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::Tidak ada .xcworkspace di ios/ - prebuild gagal?" >&2
            ls -la ios 2>/dev/null >&2 || echo "folder ios/ tidak ada" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Tidak ada .app di dalam arsip - archive gagal?" >&2
            find build/App.xcarchive -maxdepth 3 >&2 2>/dev/null || true
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          STAGE="$RUNNER_TEMP/PayloadStage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          zip -qry "$GITHUB_WORKSPACE/lkh-kkn-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lkh-kkn-ios-ipa-unsigned
          path: lkh-kkn-ios-unsigned.ipa
          retention-days: 14
